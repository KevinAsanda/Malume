  <text x="424" y="146" fill="#34d399" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">BACKEND CORE (.NET 8 CLEAN ARCHITECTURE)</text>
  <text x="424" y="174" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Malume.Api + SignalR Hub</text>

