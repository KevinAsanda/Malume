  <text x="440" y="332" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12">MediatR CQRS · FluentValidation · Corridor Matching</text>

  <rect x="424" y="370" width="302" height="72" rx="10" fill="#1b3028" stroke="#475569"/>
  <text x="440" y="396" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Malume.Domain &amp; Shared.Contracts</text>
  <text x="440" y="418" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12">Escrow Ledger (40/30/30) · Handover &amp; Seat Entities</text>

  <rect x="424" y="456" width="302" height="76" rx="10" fill="#1b3028" stroke="#475569"/>
  <text x="440" y="482" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Malume.Infrastructure</text>
  <text x="440" y="504" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12">EF Core 8 · NetTopologySuite (SRID 4326) · Auth</text>

  <!-- Data & CI Column -->
  <rect x="816" y="112" width="260" height="205" rx="12" fill="#162822" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="838" y="144" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">SPATIAL PERSISTENCE</text>
  <text x="838" y="172" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">SQL Server 2022</text>
  <text x="838" y="200" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">• geography (SRID 4326) corridors</text>
  <text x="838" y="224" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">• 1.5 km route-buffer intersection</text>
  <text x="838" y="248" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">• Double-entry escrow ledger</text>
  <text x="838" y="272" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">• Dockerized init &amp; migrations</text>

  <rect x="816" y="344" width="260" height="212" rx="12" fill="#162822" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="838" y="376" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">QUALITY &amp; CI/CD PIPELINE</text>
  <text x="838" y="404" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">5-Job GitHub Actions</text>
  <text x="838" y="432" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">1. xUnit + Testcontainers.MsSql</text>
  <text x="838" y="456" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">2. GHCR Container Image Build</text>
  <text x="838" y="480" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">3. Blazor WASM Artifact Build</text>
  <text x="838" y="504" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">4. Signed Android APK Pipeline</text>
  <text x="838" y="528" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">5. Shared Contracts Validation</text>

